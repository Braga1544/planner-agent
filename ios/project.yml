name: Planer
options:
  bundleIdPrefix: de.planer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Planer:
    type: application
    platform: iOS
    sources:
      - path: Planer
    info:
      path: Planer/Info.plist
      properties:
        CFBundleDisplayName: Planer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Für die Spracheingabe im Chat und in der Schnellerfassung."
        NSSpeechRecognitionUsageDescription: "Damit gesprochene Eingaben auf dem iPhone in Text umgewandelt werden."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.planer.app
        TARGETED_DEVICE_FAMILY: "1"
  PlanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlanerTests
    dependencies:
      - target: Planer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.planer.app.tests
schemes:
  Planer:
    build:
      targets:
        Planer: all
        PlanerTests: [test]
    test:
      targets:
        - PlanerTests
