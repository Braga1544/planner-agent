# docker compose -f docker-compose.prod.yml up -d --build, values from .env
name: planner
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_DB: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # no ports, internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - "no-new-privileges:true"

  api:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      # overrides DATABASE_URL from .env
      DATABASE_URL: postgresql+asyncpg://planner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/planner
      SCHEDULER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    # empty LAN_IP = localhost only
    ports:
      - "${LAN_IP:-127.0.0.1}:${APP_PORT:-8080}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    # tunnel public hostname -> http://api:8000
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # one-off: docker compose -f docker-compose.prod.yml run --rm backup now
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      TZ: Europe/Berlin
      PGHOST: db
      PGUSER: planner
      PGDATABASE: planner
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # root because of bind mount permissions
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - "no-new-privileges:true"

volumes:
  pgdata:
