[project]
name = "planner-agent"
version = "0.1.0"
description = "planner-agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=1.0",
    "icalendar>=6.1",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = ["live: hits the real anthropic api (costs money, run manually)"]
addopts = "-m 'not live'"
